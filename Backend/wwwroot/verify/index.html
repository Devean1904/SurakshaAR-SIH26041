<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurakshaAR — Certificate Verify</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4f;
            --text: #e8eef7;
            --muted: #8a9bb5;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { margin-top: 20px; display: none; padding: 16px; border-radius: 8px; font-size: 0.95rem; }
        #result.valid { display: block; background: rgba(34,197,94,0.12); border: 1px solid var(--success); }
        #result.invalid { display: block; background: rgba(239,68,68,0.12); border: 1px solid var(--danger); }
        #result.error { display: block; background: rgba(239,68,68,0.08); border: 1px solid var(--border); color: var(--muted); }
        #result dt { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
        #result dd { margin: 2px 0 0; font-weight: 600; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .badge.ok { background: var(--success); color: #052e16; }
        .badge.bad { background: var(--danger); color: #fff; }
        a { color: var(--primary); text-decoration: none; }
        .footer { margin-top: 20px; text-align: center; font-size: 0.85rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <h1>SurakshaAR</h1>
        <p class="subtitle">Verify a mining safety training certificate by QR payload or certificate ID.</p>

        <form id="verify-form">
            <label for="payload">Certificate QR payload</label>
            <input type="text" id="payload" placeholder="SURAKSHA:CERT-20260101-ABCDEF12:…" required autocomplete="off">
            <button type="submit" id="verify-btn">Verify Certificate</button>
        </form>

        <div id="result"></div>

        <p class="footer"><a href="/admin/">Admin Dashboard</a> · <a href="/health">API Health</a></p>
    </div>

    <script>
        const form = document.getElementById('verify-form');
        const resultEl = document.getElementById('result');
        const btn = document.getElementById('verify-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const raw = document.getElementById('payload').value.trim();
            if (!raw) return;

            btn.disabled = true;
            btn.textContent = 'Verifying…';
            resultEl.className = '';
            resultEl.style.display = 'none';
            resultEl.innerHTML = '';

            try {
                const encoded = encodeURIComponent(raw);
                const res = await fetch(`/api/certificate/verify/${encoded}`);
                const data = await res.json();

                if (res.ok && data.valid) {
                    resultEl.className = 'valid';
                    resultEl.innerHTML = `
                        <span class="badge ok">VALID</span>
                        <dl>
                            <dt>Certificate ID</dt><dd>${esc(data.certificateId || '—')}</dd>
                            <dt>Employee</dt><dd>${esc(data.employeeName || '—')}</dd>
                            <dt>Module</dt><dd>${esc(data.moduleName || '—')}</dd>
                            <dt>Score</dt><dd>${esc(data.score ?? '—')}</dd>
                            <dt>Issued</dt><dd>${esc(formatDate(data.issuedAt))}</dd>
                        </dl>`;
                } else {
                    resultEl.className = 'invalid';
                    resultEl.innerHTML = `<span class="badge bad">NOT FOUND</span><p>${esc(data.message || 'No certificate matches this payload.')}</p>`;
                }
            } catch (err) {
                resultEl.className = 'error';
                resultEl.textContent = 'Could not reach the verification service. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify Certificate';
            }
        });

        function esc(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function formatDate(iso) {
            if (!iso) return '—';
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        }

        // Support ?payload= deep link (e.g. from QR short URLs)
        const params = new URLSearchParams(window.location.search);
        const pre = params.get('payload');
        if (pre) {
            document.getElementById('payload').value = pre;
            form.dispatchEvent(new Event('submit'));
        }
    </script>
</body>
</html>
